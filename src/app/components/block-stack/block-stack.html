<div class="panel-head">
  <span>{{ s().yourPage }}</span>
  <span class="hint">{{ s().count(store.blocks().length) }}</span>
</div>

<div
  #body
  class="panel-body"
  (mouseover)="onMouseOver($event)"
  (mouseleave)="store.hoverTo(null)"
  (focusin)="onFocusIn($event)"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  @for (b of store.blocks(); track b.id; let i = $index) {
    @if (dropIndex() === i) {
      <div class="drop-ind"></div>
    }
    <app-block-card [block]="b" />
  } @empty {
    <div class="empty">
      <span class="big">🧩</span>
      <span [innerHTML]="s().dropHint"></span>
    </div>
  }
  @if (dropIndex() === store.blocks().length) {
    <div class="drop-ind"></div>
  }
</div>
